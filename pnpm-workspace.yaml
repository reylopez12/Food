# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# This setting requires that any npm package version must have been published
# for at least 1 day (1440 minutes) before pnpm will allow installing it.
# This is a critical defense against supply-chain attacks. In most cases,
# malicious npm releases are discovered and pulled within hours, so a 1-day
# delay provides a strong safety buffer.
#
# DO NOT DISABLE THIS SETTING. Removing or setting it to 0 is considered
# extremely dangerous and leaves the entire workspace vulnerable to supply-
# chain attacks, which have been the #1 vector for npm ecosystem compromises.
#
# If you absolutely need to install a package before the 1-day window has
# passed (e.g. an urgent security bugfix), you can add it to the
# `minimumReleaseAgeExclude` allowlist below. Only consider doing this for
# packages released by trusted organizations with an impeccable security
# posture (e.g. Replit packsges, react from Meta, typescript from Microsoft). Even then,
# remove the exclusion once the 1-day window has passed.
#
# Example:
#   minimumReleaseAgeExclude:
#     - react
#     - typescript
#
# ============================================================================
packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

autoInstallPeers: false

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.21
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  # Use one React type line across mobile and web to avoid split peer types.
  '@types/react': ~19.2.18
  '@types/react-dom': ~19.2.7
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  # Must be this exact version because expo requires it
  react: 19.2.3
  # Must be this exact version because expo requires it
  react-dom: 19.2.3
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.7
  wouter: ^3.3.5
  zod: ^3.25.76

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  # Replit packages are trusted and exempt from the minimum release age check.
  - '@replit/*'
  - stripe-replit-sync

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

overrides:
  # drizzle-kit uses an older vulnerable esbuild loader; use tsx instead.
  '@esbuild-kit/esm-loader': npm:tsx@^4.21.0
  # Patched transitive dependencies; preserve major lines where possible.
  '@xmldom/xmldom@<0.9.0': 0.8.15
  '@xmldom/xmldom@>=0.9.0 <0.9.12': 0.9.12
  baseline-browser-mapping: 2.11.27
  brace-expansion@1: 1.1.21
  brace-expansion@2: 2.1.7
  brace-expansion@5: 5.0.12
  browserslist: 4.29.3
  compression: 1.8.2
  decode-uri-component: 0.5.0
  esbuild: 0.28.2
  http-cache-semantics: 4.3.0
  js-yaml@3: 3.15.2
  js-yaml@4: 4.3.2
  # SDK-compatible Metro patch removes the vulnerable image-size parser.
  metro@0.83: 0.83.8
  nanoid@3: 3.3.18
  postcss-selector-parser: 7.1.6
  postcss@8: 8.5.29
  proxy-addr: 2.0.8
  shell-quote: 1.12.0
  source-map-js: 1.2.2
  tar: 7.5.22
  undici@6: 6.29.0
  # xcode and ngrok only use the unchanged CommonJS uuid.v4() API.
  uuid@<11.1.1: 11.1.1

patchedDependencies:
  # No upstream fixes for these three advisories; see docs/dependency-security.md.
  braces@3.0.3: patches/braces@3.0.3.patch
  node-forge@1.4.0: patches/node-forge@1.4.0.patch
  query-string@7.1.3: patches/query-string@7.1.3.patch
